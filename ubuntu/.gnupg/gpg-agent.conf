# Terminal passphrase prompt.
#
# This previously pointed at "/mnt/c/Program Files (x86)/Gpg4win/bin/pinentry.exe",
# a path that never existed on this machine — Gpg4win was never installed. It went
# unnoticed because the key it was meant to unlock carried no passphrase (KEYINFO
# protection 'C'), so gpg-agent never had reason to launch a pinentry at all.
#
# Nothing currently needs this: commit signing moved to SSH (see gpg.format in
# ~/.gitconfig) on 2026-08-07, and both halves of the GPG key were removed the same
# day — the private key from this machine, the public key from GitHub. Commits it
# signed are still Verified, confirmed by re-querying them after the deletion:
# GitHub records verification when a commit is pushed and never re-evaluates it
# against the current key list. Note GitLab differs — it separates "delete" (history
# stays verified) from "revoke" (history is retroactively unverified).
#
# This setting matters again only if a protected key is imported here.
#
# pinentry-curses ships with Ubuntu and adds no new dependency. It needs GPG_TTY,
# which config.fish exports. If signing is ever triggered from a GUI with no
# controlling terminal, install pinentry-gnome3 and point this at it instead —
# that renders natively over WSLg.
pinentry-program /usr/bin/pinentry-curses

# ~400 days. Vestigial while no protected key exists, but harmless.
default-cache-ttl 34560000
max-cache-ttl 34560000
