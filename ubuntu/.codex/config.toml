# ====================
[mcp_servers.context7]
args = ["-y", "@upstash/context7-mcp@latest"]
command = "npx"

[mcp_servers.playwright]
args = ["@playwright/mcp@latest"]
command = "npx"
enabled = false

# Provided by the aws-agents plugin. Redundant with aws-mcp from aws-core, which
# serves the same docs tools and no longer needs auth to do it. Disabled rather
# than removing the plugin, which would also drop its 8 AgentCore skills.
# Upstream: https://github.com/aws/agent-toolkit-for-aws/issues/223
[mcp_servers.awsknowledge]
url = "https://knowledge-mcp.global.api.aws"
enabled = false

