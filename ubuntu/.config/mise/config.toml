[tools]
# ====================
# AI CLIs
# ====================
amp = "latest"
claude-code = "latest"
codex = "latest"
kiro-cli = "2.16.0"
opencode = "latest"
opencodex = "latest"
pi = "latest"
reasonix = { version = "latest", asset_pattern = 'reasonix-{{ os(linux="linux", macos="darwin") }}-{{ arch(x64="amd64") }}.tar.gz' }

# ====================
# Development
# ====================
# Build Systems
bazel = "9.2.0"
cmake = "4.4.2"
just = "1.56.0"
moon = "latest"

# Languages
dotnet = "10"
go = "1.25"
python = "3.14"
rust = { version = "stable", components = "rustfmt", targets = "aarch64-unknown-linux-gnu, wasm32-unknown-unknown" }
zig = "0.16"

# JS Runtimes
bun = "latest"
node = "lts"

# JS Tools
aube = "latest"
biome = "2"
pnpm = "11"
yarn = "1"

# Python Tools
ruff = "latest"
uv = "latest"

# Rust Tools
cargo-binstall = "latest"
"cargo:cargo-audit" = "latest"
"cargo:cargo-deny" = "latest"
"cargo:cargo-edit" = "0.13.11"
"cargo:cargo-lambda" = "latest"
"cargo:cargo-machete" = "latest"
"cargo:cargo-nextest" = "0.9.140"
"cargo:cargo-outdated" = "latest"
"cargo:cargo-udeps" = "latest"
"cargo:trunk" = "latest"

# Shell Tools
shellcheck = "latest"
shfmt = "latest"

# YAML/JSON Tools
actionlint = "latest"
jq = "latest"
taplo = "latest"
yq = "latest"

# Git
git-filter-repo = "latest"
git-lfs = "latest"
github-cli = "latest"

# ====================
# Cloud
# ====================
# AWS
#"github:runs-on/cli" = "latest"
aws-cdk = "2"
aws-cli = "2"
aws-sam = "1"
cli53 = "latest"
granted = "latest"

# Generic
"npm:cdktf-cli" = "0.21"
opentofu = "1"
pulumi = "3"
terraform = "1"

# Others
gcloud = "577"
kraftkit = "0.12.11"
wrangler = "latest"

# ====================
# Security
# ====================
age = "latest"
cosign = "3"
slsa-verifier = "latest"
sops = "latest"

# ====================
# Utilities
# ====================
bat = "latest"
dotslash = "0.5.9"
edit = "latest"
eza = "latest"
fd = "latest"
ffmpeg = "latest"
fzf = "latest"
oh-my-posh = "latest"
oha = "latest"
powershell = "7"
ripgrep = "latest"
sqlite = "3.53.3"
yt-dlp = "latest"

# ====================
# Tool Aliases
# ====================
[tool_alias]
kraftkit = "github:unikraft/kraftkit"
moon = "aqua:moonrepo/moon"
opencodex = "npm:@bitkyc08/opencodex"
reasonix = "github:esengine/DeepSeek-Reasonix"
wrangler = "npm:cloudflare/wrangler"

# ====================
# Settings
# ====================
[settings]
minimum_release_age_excludes = [
  "claude-code",
  "codex",
  "kiro-cli",
  "opencodex",
  "opencode",
  "pi",
]

[settings.cargo]
# Only use cargo-binstall for installation, fail if not available.
binstall_only = true

[settings.github]
# Reuse the existing git credential helper (GCM) so mise's GitHub API calls
# are authenticated (5,000 req/hr) instead of throttled (60 req/hr).
use_git_credentials = true
