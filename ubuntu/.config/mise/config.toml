unikraft-cli = "aqua:unikraft-cloud/cli"

# ====================
# Tasks
# ====================
[tasks."opencodex:upgrade"]
description = "Upgrade OpenCodex, restart an outdated proxy, and verify live version parity"
run = '''
set -eu

mise upgrade opencodex

cli_version="$(ocx --version | awk 'NR == 1 { print $2 }')"
if [ -z "$cli_version" ]; then
  echo "Could not determine the installed OpenCodex version." >&2
  exit 1
fi

live_version="$(
  curl --fail --silent http://127.0.0.1:10100/healthz 2>/dev/null \
    | jq -r '.version // empty' 2>/dev/null \
    || true
)"

if [ "$live_version" = "$cli_version" ]; then
  echo "OpenCodex CLI and proxy already match at $cli_version."
  exit 0
fi

if [ -n "$live_version" ]; then
  echo "Replacing OpenCodex proxy $live_version with $cli_version."
  ocx stop
else
  echo "Starting OpenCodex proxy $cli_version."
fi

if systemctl --user cat opencodex-proxy.service >/dev/null 2>&1; then
  ocx service start
else
  ocx start
fi

attempt=0
while [ "$attempt" -lt 50 ]; do
  live_version="$(
    curl --fail --silent http://127.0.0.1:10100/healthz 2>/dev/null \
      | jq -r '.version // empty' 2>/dev/null \
      || true
  )"
  if [ "$live_version" = "$cli_version" ]; then
    echo "OpenCodex CLI and proxy are both $cli_version."
    exit 0
  fi
  attempt=$((attempt + 1))
  sleep 0.2
done

echo "OpenCodex version mismatch after restart: CLI=$cli_version proxy=${live_version:-unavailable}." >&2
exit 1
'''

# ====================
# Settings
# ====================
[settings]
minimum_release_age_excludes = [
  "claude-code",
  "codex",
  "dsh",
  "kiro-cli",
  "opencode",
  "opencode2",
  "opencodex",
  "pi",
  "reasonix",
]

[settings.cargo]
# Prefer cargo-binstall, but let mise build releases that do not publish a binary.
binstall_only = false

[settings.github]
# Reuse the existing git credential helper (GCM) so mise's GitHub API calls
# are authenticated (5,000 req/hr) instead of throttled (60 req/hr).
use_git_credentials = true
