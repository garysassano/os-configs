[tools]
# ====================
# AI CLIs
# ====================
amp = "0.0.1785861307-g4e053f"
claude-code = "latest"
codex = "latest"
dsh = { version = "latest", allow_builds = ["node-pty"] }
kiro-cli = "2.18.0"
opencode = "latest"
opencode2 = { version = "next", allow_builds = ["@opencode-ai/cli"] }
opencodex = "latest"
pi = "0.84.2"
reasonix = { version = "1.25.2", asset_pattern = 'reasonix-{{ os(linux="linux", macos="darwin") }}-{{ arch(x64="amd64") }}.tar.gz' }

# ====================
# Development
# ====================
# Build Systems
bazel = "9.2.0"
cmake = "4.4.2"
just = "1.56.0"
moon = "latest"

# Languages
dotnet = "10.0.400"
go = "1.26"
python = "3.14"
rust = { version = "stable", components = "rustfmt", targets = "aarch64-unknown-linux-gnu, wasm32-unknown-unknown" }
zig = "0.16"

# JS Runtimes
bun = "latest"
node = "lts"

# JS Tools
aube = "latest"
biome = "2"
pnpm = "11"
prettier = "latest"
yarn = "1"

# Python Tools
ruff = "latest"
uv = "latest"

# Rust Tools
cargo-binstall = "latest"
"cargo:cargo-audit" = "latest"
"cargo:cargo-deny" = "latest"
"cargo:cargo-edit" = "0.13.11"
"cargo:cargo-lambda" = "latest"
"cargo:cargo-machete" = "latest"
"cargo:cargo-nextest" = "0.9.140"
"cargo:cargo-outdated" = "latest"
"cargo:cargo-udeps" = "latest"
"cargo:trunk" = "latest"

# Shell Tools
shellcheck = "latest"
shfmt = "latest"

# YAML/JSON Tools
actionlint = "latest"
jq = "latest"
taplo = "latest"
yq = "latest"

# Git
git-filter-repo = "latest"
git-lfs = "latest"
github-cli = "latest"

# ====================
# Cloud
# ====================
# AWS
aws-cdk = "2"
aws-cli = "2"
aws-sam = "1"
cli53 = "0.9.0"
granted = "latest"
runs-on = "3.2.2"

# Generic
cdktf = { version = "0.21", trust_policy_excludes = ["detect-port@1.6.1"] }
cdktn = { version = "0.24", trust_policy_excludes = ["jsii@5.9.52"] }
opentofu = "1"
pulumi = "3"
terraform = "1"
terragrunt = "1"

# Others
gcloud = "577"
kraftkit = { version = "0.12.15", asset_pattern = 'kraft_*_{{ os(linux="linux", macos="darwin") }}_{{ arch(x64="amd64", arm64="arm64") }}.tar.gz' }
unikraft-cli = { version = "0.4.2", asset_pattern = 'unikraft-cli_*_{{ os(linux="linux", macos="darwin") }}_{{ arch(x64="amd64", arm64="arm64") }}.tar.gz' }
wrangler = "latest"

# ====================
# Security
# ====================
age = "latest"
cosign = "3"
gitleaks = "latest"
slsa-verifier = "latest"
sops = "latest"

# ====================
# Utilities
# ====================
bat = "latest"
edit = "latest"
eza = "latest"
fd = "latest"
ffmpeg = "latest"
fzf = "latest"
oh-my-posh = "latest"
oha = "latest"
powershell = "7"
ripgrep = "latest"
sqlite = "3.53.3"
upx = "latest"
yt-dlp = "latest"

# ====================
# Tool Aliases
# ====================
[tool_alias]
cdktf = "npm:cdktf-cli"
cdktn = "npm:cdktn-cli"
dsh = "npm:@deepseek-ai/dsh"
kraftkit = "github:unikraft/kraftkit"
moon = "aqua:moonrepo/moon"
opencode2 = "npm:@opencode-ai/cli"
opencodex = "npm:@bitkyc08/opencodex"
prettier = "npm:prettier"
reasonix = "github:esengine/DeepSeek-Reasonix"
runs-on = "github:runs-on/cli"
unikraft-cli = "github:unikraft-cloud/cli"
wrangler = "npm:wrangler"

# ====================
# Settings
# ====================
[settings]
minimum_release_age_excludes = [
  "claude-code",
  "codex",
  "dsh",
  "kiro-cli",
  "opencode",
  "opencode2",
  "opencodex",
  "pi",
  "reasonix",
]

[settings.cargo]
# Only use cargo-binstall for installation, fail if not available.
binstall_only = true

[settings.github]
# Reuse the existing git credential helper (GCM) so mise's GitHub API calls
# are authenticated (5,000 req/hr) instead of throttled (60 req/hr).
use_git_credentials = true
